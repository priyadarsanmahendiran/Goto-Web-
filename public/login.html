<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Go-to!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
    <script>
        document.onreadystatechange = function () {
            if (document.readyState !== "complete") {
                document.querySelector("body").style.visibility = "hidden";
                document.querySelector("#loader").style.visibility = "visible";
            } else {
                document.querySelector("#loader").style.display = "none";
                document.querySelector("body").style.visibility = "visible";
            }
        };
    </script>
</head>
<body id="loginPage">
    <div id="loader">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="row g-0 auth-split">
        <div class="col-lg-6 d-none d-lg-block auth-image auth-image-login">
            <div class="auth-brand">
                <div class="auth-logo">
                    <img src="./images/b515e6c2-9e5f-486e-908d-dc3ecd0f8ab4_200x200.png" width="36" height="36" alt="Go-to!">
                    Go-to!
                </div>
                <h2>Your diary,<br>your world.</h2>
                <p>Write memories, track expenses, and stay on top of your to-do list — all in one place.</p>
            </div>
        </div>
        <div class="col-lg-6 auth-panel">
            <div class="auth-form-wrap">
                <p class="auth-sub">Welcome back</p>
                <h2 class="auth-heading">Sign in</h2>
                <input id="username" type="email" placeholder="Email address" required autofocus class="auth-input mt-4">
                <input id="password" type="password" placeholder="Password" required class="auth-input">
                <button type="button" class="auth-btn" id="loginbtn">Sign In</button>
                <div class="auth-links">
                    <a href="registeruser.html">New here? Create account</a>
                    <a href="forgotpassword.html">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/__/firebase/7.15.5/firebase-app.js"></script>
    <script src="/__/firebase/7.15.5/firebase-analytics.js"></script>
    <script src="/__/firebase/7.15.5/firebase-auth.js"></script>
    <script src="/__/firebase/7.15.5/firebase-firestore.js"></script>
    <script src="/__/firebase/7.15.5/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./snackbar.js"></script>
    <script type="module" src="./login.js"></script>
</body>
</html>
